<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480">
  <title>Onion Quality Assessment &amp; Grading System Hero</title>
  <desc>Decoupled dual-stage deep learning vision system with YOLOv8n-seg, YOLOv8n-cls, and ArUco planar homography for post-harvest onion grading</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="480" rx="16" fill="url(#grid)"/>

  <!-- Left Column: Typography & Metadata -->
  <!-- Eyebrow Pill -->
  <g transform="translate(50, 42)">
    <rect width="470" height="28" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="15" cy="14" r="5" fill="#f59e0b"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1.2">RESEARCH REPORT &amp; PRODUCTION VISION SYSTEM</text>
  </g>

  <!-- Main Headline -->
  <text x="50" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">Onion Quality Assessment</text>
  <text x="50" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#38bdf8" letter-spacing="-0.4">&amp; Precision Optical Grading</text>

  <!-- Subtitle Paragraph -->
  <text x="50" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    Decoupled Two-Stage Deep Learning with Planar ArUco Homography
  </text>
  <text x="50" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748b">
    Automated Indian Mandi Intake (NAFED / NCCF) • 45–65 mm DoCA Norms • AGMARK Tiering
  </text>

  <!-- Key Metrics 4-Card Grid -->
  <g transform="translate(50, 275)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="138" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="700" fill="#10b981">96.7%</text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Mask mAP@0.5</text>

    <!-- Card 2 -->
    <rect x="150" y="0" width="138" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="166" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="700" fill="#38bdf8">94.3%</text>
    <text x="166" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Defect Top-1 Acc</text>

    <!-- Card 3 -->
    <rect x="300" y="0" width="138" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="316" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="700" fill="#f59e0b">6.9 ms</text>
    <text x="316" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Dual GPU Latency</text>

    <!-- Card 4 -->
    <rect x="450" y="0" width="138" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="466" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="700" fill="#a855f7">±0.4 mm</text>
    <text x="466" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Planar Precision</text>
  </g>

  <!-- Bottom Spec Chips -->
  <g transform="translate(50, 395)">
    <rect x="0" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#cbd5e1">YOLOv8n-seg 3.26M</text>

    <rect x="155" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="167" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#cbd5e1">YOLOv8n-cls 1.44M</text>

    <rect x="310" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="322" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#cbd5e1">ArUco DICT_4X4</text>

    <rect x="455" y="0" width="133" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="467" y="18" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#cbd5e1">FastAPI + React</text>
  </g>

  <!-- Right Column: Optical Metrology & HUD Visual Instrument -->
  <g transform="translate(680, 40)">
    <!-- HUD Panel Container -->
    <rect width="470" height="395" rx="14" fill="#0b1320" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 456 0 Q 470 0 470 14 L 470 42 L 0 42 Z" fill="#111c2e"/>
    <circle cx="22" cy="21" r="5" fill="#10b981"/>
    <text x="36" y="26" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#e2e8f0">OPTICAL METROLOGY HUD • LIVE INTAKE</text>
    <rect x="365" y="11" width="92" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="375" y="25" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#10b981">LIVE 60 FPS</text>

    <!-- Reticle Grid & Crosshairs -->
    <circle cx="235" cy="205" r="110" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="235" cy="205" r="60" fill="none" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="235" y1="75" x2="235" y2="335" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="2,4"/>
    <line x1="105" y1="205" x2="365" y2="205" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- Calibrated ArUco Marker Card Representation -->
    <g transform="translate(30, 60)">
      <rect width="80" height="80" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <rect x="10" y="10" width="60" height="60" fill="#000000"/>
      <!-- ArUco Inner Matrix -->
      <rect x="22" y="22" width="18" height="18" fill="#ffffff"/>
      <rect x="40" y="40" width="18" height="18" fill="#ffffff"/>
      <!-- Label -->
      <rect x="0" y="85" width="80" height="18" rx="3" fill="#1e293b"/>
      <text x="6" y="98" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#38bdf8">50.0mm [ID:0]</text>
    </g>

    <!-- Segmented Onion Contour (Model 1 YOLOv8n-seg Polygon) -->
    <!-- Center of Onion at (255, 205) -->
    <path d="M 255 125 C 310 125, 335 160, 335 205 C 335 255, 305 285, 255 285 C 205 285, 175 255, 175 205 C 175 160, 200 125, 255 125 Z" 
          fill="#f59e0b" fill-opacity="0.2" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,2"/>

    <!-- Onion Skin Core Highlight -->
    <ellipse cx="255" cy="205" rx="72" ry="74" fill="#d97706" fill-opacity="0.25"/>

    <!-- Caliper / Equatorial Measurement Axis (Model 1 + Calibration) -->
    <line x1="175" y1="205" x2="335" y2="205" stroke="#38bdf8" stroke-width="2"/>
    <line x1="175" y1="195" x2="175" y2="215" stroke="#38bdf8" stroke-width="2"/>
    <line x1="335" y1="195" x2="335" y2="215" stroke="#38bdf8" stroke-width="2"/>

    <!-- Caliper Pill Measurement Callout -->
    <rect x="200" y="165" width="110" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="183" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8">d = 55.4 mm</text>

    <!-- Detection Tag (Model 2 Classification + DoCA Rule Engine) -->
    <g transform="translate(190, 85)">
      <rect width="130" height="26" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="17" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="700" fill="#10b981">SOUND / HEALTHY</text>
    </g>

    <!-- Bottom HUD Telemetry Strip -->
    <g transform="translate(20, 320)">
      <rect width="430" height="58" rx="8" fill="#111c2e" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#94a3b8">DoCA PROCUREMENT VERDICT</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#10b981">✓ GRADE-A COMPLIANT (45–65 mm BAND)</text>
      
      <text x="270" y="22" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#94a3b8">TILT COMPENSATED</text>
      <text x="270" y="44" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#38bdf8">θ = 6.5° • H-Norm</text>
    </g>
  </g>
</svg>
