[project]
name = "onion-grading"
version = "0.1.0"
description = "Handheld AI onion quality assessment and multi-standard grading"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "imagehash>=4.3.1",
    "Pillow>=10.4.0",
    "pydantic>=2.8.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


